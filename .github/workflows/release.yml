name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Publica la imagen en el registro de contenedores de GitHub. No necesita
  # credenciales externas: cualquier plataforma (Cloud Run, Railway, Fly)
  # puede desplegar desde aquí.
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Verificación post-despliegue. Se activa configurando la variable de repo
  # STAGING_URL con la URL de la instancia (Settings → Variables).
  smoke:
    runs-on: ubuntu-latest
    needs: image
    if: vars.STAGING_URL != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Da margen a que la plataforma promueva la nueva revisión antes de medir.
      - name: Esperar al despliegue
        run: sleep 30

      - name: Smoke test contra staging
        run: npm run test:smoke
        env:
          SEYF_API_BASE_URL: ${{ vars.STAGING_URL }}
